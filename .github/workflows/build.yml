name: Build

# Weekly rebuild of fHori/thelounge master with the patches in patches/, so the image
# picks up upstream fixes and base-image (node bookworm-slim) security updates.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: fHori/thelounge
  IMAGE: ghcr.io/${{ github.repository_owner }}/thelounge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: src

      - name: Apply patches
        working-directory: src
        run: |
          for p in ../patches/*.patch; do
            echo "applying $p"
            git apply --verbose "$p"
          done
          echo "UPSTREAM_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "tags<<EOT"
            echo "${IMAGE,,}:latest"
            echo "${IMAGE,,}:upstream-${UPSTREAM_SHA}"
            echo "${IMAGE,,}:$(date -u +%Y%m%d)"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          pull: true
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.description=fHori/thelounge with local patches, rebuilt weekly
